name: Release Installation Script

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          # Ensure script is executable
          chmod +x install.sh

          # Validate script syntax
          bash -n install.sh

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            install.sh
            docker-compose.yml
            nginx/nginx.conf
            app/index.js
            app/package.json
            app/public/index.html
            .env.example
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./install.sh
          asset_name: open-claw-install.sh
          asset_content_type: application/x-sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify installation script
        run: |
          echo "=== Verifying installation script ==="
          head -50 install.sh
          echo "..."
          echo "=== Script size ==="
          wc -l install.sh
          echo "=== Checking for common issues ==="
          grep -c "set -e" install.sh && echo "Has error handling"
          grep -c "curl" install.sh && echo "Has curl commands"
          grep -c "openssl" install.sh && echo "Has OpenSSL"

  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        env:
          SHELLCHECK_OPTS: -s bash -x
        with:
          filename: install.sh

      - name: Check for secrets
        run: |
          echo "=== Checking for accidentally committed secrets ==="
          if grep -iE "(password|api_key|token|secret)\s*=\s*['\"]?[a-zA-Z0-9]{20,}['\"]?" install.sh; then
            echo "WARNING: Possible hardcoded secrets found!"
            exit 1
          else
            echo "No obvious secrets found in install.sh"
          fi
