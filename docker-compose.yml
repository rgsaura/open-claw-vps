# OpenClaw VPS Management System
# Docker Compose Configuration for Production Deployment
#
# Usage:
#   curl -fsSL https://raw.githubusercontent.com/rgsaura/open-claw-vps/main/install.sh | bash
#
# Or manually:
#   curl -fsSL https://github.com/rgsaura/open-claw-vps/archive/main.tar.gz | tar xz
#   cd open-claw-vps-main
#   cp .env.example .env  # Edit with your configuration
#   docker-compose up -d
#
# Access:
#   https://localhost:8443
#
# IMPORTANT: Change default credentials and configure SSL certificates for production!

version: '3.8'

services:
  # Nginx reverse proxy with security headers
  nginx:
    image: nginx:alpine
    container_name: open-claw-nginx
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
      - "${SSL_PORT:-8443}:8443"
    volumes:
      - ./app:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - app
    networks:
      - open-claw-net
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run
      - /tmp
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    cap_drop:
      - ALL
      - NET_RAW
      - CHOWN
      - DAC_OVERRIDE
      - FSETID
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - SYS_CHROOT
      - KILL
      - AUDIT_WRITE

  # Application backend
  app:
    image: node:20-alpine
    container_name: open-claw-app
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install --production && node index.js"
    volumes:
      - ./app:/app
      - app-data:/data
      - app-cache:/tmp
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SESSION_SECRET=${SESSION_SECRET}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - TELESCALE_API_KEY=${TELESCALE_API_KEY}
      - TELESCALE_WEBHOOK_SECRET=${TELESCALE_WEBHOOK_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      - TRUST_PROXY=true
    networks:
      - open-claw-net
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache
    cap_drop:
      - ALL
    ulimits:
      nproc: 4096
      nofile:
        soft: 65535
        hard: 65535

networks:
  open-claw-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: open-claw-br
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  app-data:
    driver: local
  app-cache:
    driver: local
